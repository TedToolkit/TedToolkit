on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Run Build
        uses: $/.github/actions/run-build
        env:
          BUILD_SOLUTION: ${{ vars.BUILD_SOLUTION || (github.repository == 'TedToolkit/TedToolkit' && 'TedToolkit.slnx') || '' }}
          BUILD_TEST_PROJECTS: ${{ vars.BUILD_TEST_PROJECTS }}
          DotNet__Configuration: ${{ vars.BUILD_CONFIGURATION || 'Release' }}
          NuGet__ApiKey: ${{ secrets.NUGET__APIKEY }}
          NuGet__Url: ${{ vars.NUGET__URL }}
          NuGet__Source: ${{ vars.NUGET__SOURCE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: output/
          retention-days: 2
          if-no-files-found: ignore
