name: Publish TedToolkit packages to NuGet.org
description: Build, test, pack, and publish with a short-lived NuGet.org credential
inputs:
  nuget-user:
    description: NuGet.org account name that owns the trusted publishing policy
    required: true
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Build solution
      uses: $/.github/actions/run-build
      env:
        BUILD_STAGE: build
        BUILD_SOLUTION: ${{ vars.BUILD_SOLUTION || (github.repository == 'TedToolkit/TedToolkit' && 'TedToolkit.slnx') || '' }}
        BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION || 'Release' }}

    - name: Run tests
      if: vars.BUILD_TEST_PROJECTS != ''
      uses: $/.github/actions/run-build
      env:
        BUILD_STAGE: test
        BUILD_TEST_PROJECTS: ${{ vars.BUILD_TEST_PROJECTS }}
        BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION || 'Release' }}

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always() && vars.BUILD_TEST_PROJECTS != ''
      with:
        name: test-results
        path: output/test/
        if-no-files-found: warn

    - name: Resolve release version
      if: github.ref == 'refs/heads/main' && github.repository != 'TedToolkit/TedToolkit'
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        day="$(date -u +%Y.%-m.%-d)"
        latest="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // ""')"
        revision=0
        if [[ "$latest" == "$day" ]]; then
          revision=1
        elif [[ "$latest" == "$day."* ]]; then
          previous="${latest#"$day."}"
          if [[ "$previous" =~ ^[0-9]+$ ]]; then
            revision=$((10#$previous + 1))
          fi
        fi
        printf 'value=%s.%s\n' "$day" "$revision" >> "$GITHUB_OUTPUT"

    - name: Pack release packages
      if: github.ref == 'refs/heads/main'
      uses: $/.github/actions/run-build
      env:
        BUILD_STAGE: pack
        BUILD_PACK_PROJECTS: ${{ vars.BUILD_PACK_PROJECTS || (github.repository == 'TedToolkit/TedToolkit' && 'TedToolkit.slnx') || '' }}
        BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION || 'Release' }}
        BUILD_PACKAGE_VERSION: ${{ steps.version.outputs.value }}

    - name: Upload release packages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: output/nuget/
        if-no-files-found: error

    - name: Sign in to NuGet.org
      if: github.ref == 'refs/heads/main'
      id: nuget
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nuget-user }}

    - name: Publish NuGet packages
      if: github.ref == 'refs/heads/main'
      uses: $/.github/actions/run-build
      env:
        BUILD_STAGE: publish
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        NUGET_SOURCE: https://api.nuget.org/v3/index.json

    - name: Create GitHub release
      if: github.ref == 'refs/heads/main' && steps.version.outputs.value != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ steps.version.outputs.value }}
      run: gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --generate-notes
