name: Run the TedToolkit build
description: Run the build script at the same revision as the calling workflow
outputs:
  value:
    description: Release version produced by the version stage
    value: ${{ steps.script.outputs.value }}
runs:
  using: composite
  steps:
    - name: Load shared code analysis settings
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BUILD_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ -f .editorconfig ]]; then
          exit 0
        fi
        if [[ -f global.json ]] && jq -e '."msbuild-sdks"."TedToolkit.Build.Sdk" != null' global.json >/dev/null; then
          exit 0
        fi
        cp -- "$BUILD_ACTION_PATH/../../../.editorconfig" .editorconfig
    - name: Run script
      id: script
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BUILD_ACTION_PATH: ${{ github.action_path }}
      run: dotnet run -c Release --file "$BUILD_ACTION_PATH/../../../build.cs"
